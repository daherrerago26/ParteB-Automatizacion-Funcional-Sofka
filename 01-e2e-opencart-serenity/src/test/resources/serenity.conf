serenity {
  project.name = "E2E OpenCart - compra como invitado"
  # Una captura por cada acción de Screenplay
  take.screenshots = FOR_EACH_ACTION
}

# Se cambia a true con -Dheadless.mode=true para ejecutar sin ventana
headless.mode = false

webdriver {
  driver = chrome
  # Espera máxima para WaitUntil y para encontrar elementos; el sitio demo puede ser lento
  wait.for.timeout = 30000
  timeouts {
    implicitlywait = 5000
    fluentwait = 30000
  }
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
      args = ["window-size=1920,1080", "start-maximized", "incognito", "disable-infobars",
              "disable-search-engine-choice-screen", "disable-notifications", "remote-allow-origins=*"]
      prefs {
        "credentials_enable_service" = false
        "profile.password_manager_enabled" = false
        "autofill.profile_enabled" = false
      }
    }
  }
}

environments {
  default {
    # Es el sitio del enunciado (http://opencart.abstracta.us/) servido por HTTPS. Chrome sube la URL http a https
    # por su cuenta y, si el sitio tarda más de 5 s en responder por HTTPS, vuelve a http dejando la página en blanco.
    # Abrir directamente por HTTPS evita ese cambio intermedio.
    webdriver.base.url = "https://opencart.abstracta.us/"
  }
}
