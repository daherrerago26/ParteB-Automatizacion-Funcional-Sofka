buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        // El plugin y el módulo del resumen de una página (serenity-summary.html) deben compartir classpath
        classpath 'net.serenity-bdd:serenity-gradle-plugin:5.4.1'
        classpath 'net.serenity-bdd:serenity-single-page-report:5.4.1'
    }
}

plugins {
    id 'java'
}

apply plugin: 'net.serenity-bdd.serenity-gradle-plugin'

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    testImplementation "net.serenity-bdd:serenity-core:${serenityVersion}"
    testImplementation "net.serenity-bdd:serenity-cucumber:${serenityVersion}"
    testImplementation "net.serenity-bdd:serenity-screenplay:${serenityVersion}"
    testImplementation "net.serenity-bdd:serenity-screenplay-webdriver:${serenityVersion}"
    testImplementation "net.serenity-bdd:serenity-ensure:${serenityVersion}"
    testImplementation "io.cucumber:cucumber-junit-platform-engine:${cucumberVersion}"
    testImplementation "org.junit.platform:junit-platform-suite:${junitPlatformVersion}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:${junitPlatformVersion}"
    testRuntimeOnly "org.slf4j:slf4j-simple:${slf4jVersion}"
}

test {
    useJUnitPlatform()
    // Pasa las propiedades -D de la línea de comandos (headless.mode, cucumber.filter.tags, environment) a la JVM de pruebas
    systemProperties System.getProperties()
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
    }
}

// El reporte Serenity y el resumen de una página se generan aunque alguna prueba falle
gradle.startParameter.continueOnFailure = true
test.finalizedBy(aggregate)
aggregate.finalizedBy(reports)

tasks.named('reports') {
    reports.set(['single-page-html'])
}
